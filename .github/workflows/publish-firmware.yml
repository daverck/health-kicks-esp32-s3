name: Build & Publish Firmware to S3

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Firmware semantic version (leave empty to auto-extract from include/config.h)'
        required: false
        default: ''
        type: string
      changelog:
        description: 'Changelog / Release notes summary'
        required: false
        default: 'Automated release build via GitHub Actions'
        type: string
  push:
    branches:
      - main
    paths:
      - 'include/config.h'
      - 'include/activity_model_generated.h'
      - 'src/**'
      - 'platformio.ini'

env:
  AWS_REGION: eu-north-1
  S3_BUCKET: healthkicks-firmware-releases
  S3_DESTINATION_KEY: firmware/esp32s3/latest/firmware.bin

jobs:
  build-and-publish:
    name: Compile ESP32-S3 Firmware & Upload to S3
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache PlatformIO & packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-v2-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-v2-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Compile Firmware
        run: |
          pio run -e esp32-s3-devkitc-1

      - name: Verify Binary & Compute SHA-256 Checksum
        id: checksum
        run: |
          BIN_PATH=".pio/build/esp32-s3-devkitc-1/firmware.bin"
          if [ ! -f "$BIN_PATH" ]; then
            echo "::error::Binary $BIN_PATH not found after build!"
            exit 1
          fi
          
          # Compute lowercase 64-character hex SHA-256 digest
          SHA256_HASH=$(sha256sum "$BIN_PATH" | awk '{print $1}')
          FILE_SIZE=$(stat -c%s "$BIN_PATH")
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          echo "sha256=$SHA256_HASH" >> $GITHUB_OUTPUT
          echo "size=$FILE_SIZE" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
          
          # Extract semantic version from include/config.h if not explicitly provided
          EXTRACTED_VERSION=$(grep '#define FIRMWARE_VERSION' include/config.h | awk -F'"' '{print $2}')
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$EXTRACTED_VERSION"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="v1.2.1-esp32s3"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          echo "=========================================="
          echo "Firmware Version: $VERSION"
          echo "Binary Size:      $FILE_SIZE bytes"
          echo "SHA-256 Digest:   $SHA256_HASH"
          echo "UTC Build Date:   $BUILD_DATE"
          echo "=========================================="

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::693906847467:role/HealthKicksFirmwarePublisherRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Single Latest Firmware to S3
        run: |
          BIN_PATH=".pio/build/esp32-s3-devkitc-1/firmware.bin"
          VERSION="${{ steps.checksum.outputs.version }}"
          
          echo "Uploading firmware to s3://${{ env.S3_BUCKET }}/${{ env.S3_DESTINATION_KEY }}..."
          
          # Overwrite destination key so strictly ONE latest firmware file is retained on S3
          aws s3 cp "$BIN_PATH" "s3://${{ env.S3_BUCKET }}/${{ env.S3_DESTINATION_KEY }}" \
            --metadata "version=$VERSION,sha256=${{ steps.checksum.outputs.sha256 }},built_at=${{ steps.checksum.outputs.build_date }}" \
            --content-type "application/octet-stream"
          
          echo "Upload complete! Verified single latest firmware in S3:"
          aws s3api head-object --bucket "${{ env.S3_BUCKET }}" --key "${{ env.S3_DESTINATION_KEY }}"
